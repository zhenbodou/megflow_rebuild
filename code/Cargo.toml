[workspace]
resolver = "2"
members = ["flow-message", "flow-derive", "flow-rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["douzhenbo", "Claude"]

# 说明：本 workspace 只用 crates.io 公共 crate；不使用原版的 megvii 私有注册表。
# 依赖版本在此集中锁定，各 crate 用 `.workspace = true` 引用。
[workspace.dependencies]
# 异步运行时：替换原版的有栈协程 rt/{spawn_pinned,rwlock}（Ch1.4 起）。
tokio = { version = "1", features = ["sync", "rt", "macros"] }
# 类型化错误枚举：替换原版的 anyhow 黑盒（Ch1.1 决策）。
thiserror = "2"
# 过程宏三件套（Part 2 起）：proc-macro2 = 编译期把代码当数据的 token 流；
# syn = 把 token 解析成语法树；quote = 把语法树拼回代码。均为生态最基础的公共 crate。
proc-macro2 = "1"
quote = "1"
syn = "2"
# 编译期分布式注册（Part 2 Ch2.4）：各处 `inventory::submit!` 的节点条目，在
# link 期汇总成一张全局表，运行时 `inventory::iter` 枚举。替换原版自建的
# `#[flow_rs::ln]` + lazy_static registry —— 用成熟公共 crate，少一套要维护的机制。
inventory = "0.3"
# 配置解析层（Part 3 Ch3.1）：serde = 通用序列化/反序列化框架（derive 自动派生
# Deserialize）；toml = 把图拓扑的 TOML 文本解析成类型化的配置结构。均 crates.io 公共。
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.dev]
incremental = true
